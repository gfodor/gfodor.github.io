<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#061139" />
    <title>Webspace Lip Syncer</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='46' fill='%237b93db' stroke='%23061139' stroke-width='4'/%3E%3Ccircle cx='36' cy='42' r='6' fill='%23061139'/%3E%3Ccircle cx='64' cy='42' r='6' fill='%23061139'/%3E%3Cpath d='M32 62 Q50 74 68 62' stroke='%23061139' stroke-width='5' fill='none' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,400;0,700;0,900;1,400;1,900&family=Inconsolata:wght@400;700&display=swap"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body data-stage="record" data-mode="idle">
    <!-- ACT ONE · the booth -->
    <section id="screen-record" class="screen screen-record" aria-label="Recording booth">
      <p class="eyebrow">Webspace Lip Syncer</p>
      <h1 class="title">Say <em>anything.</em></h1>

      <div class="mic-zone">
        <button id="record-toggle" class="mic" type="button" aria-label="Start recording">
          <span class="mic-ring" aria-hidden="true"></span>
          <span class="mic-core" aria-hidden="true"></span>
        </button>
        <p class="timer" id="timer" aria-hidden="true">0:00.0</p>
      </div>

      <p id="status" class="status" role="status">Tap to record</p>

      <div class="strip">
        <span aria-hidden="true">MIC &rarr; PCM &rarr; GRU &rarr; VISEME</span>
        <a class="gh" href="https://github.com/webspace-sdk/webspace-lip-syncer" target="_blank" rel="noopener"
          >GITHUB &nearr;</a
        >
        <span aria-hidden="true">LIVE VISEME <strong id="live-viseme">0</strong></span>
      </div>
    </section>

    <!-- ACT TWO · the reveal -->
    <section id="screen-play" class="screen screen-play" aria-label="Playback">
      <div id="face-wrap" class="face-wrap">
        <div id="confetti" class="confetti" aria-hidden="true"></div>
        <div id="face" class="face">
          <!-- Jel-style avatar from webspace-engine (avatar-still.svgi), mouth swapped for live visemes -->
          <svg class="avatar" viewBox="0 0 186 186" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Jel avatar">
            <circle cx="93" cy="93" r="93" fill="white"/>
            <circle cx="93" cy="93" r="83.3793" fill="black"/>
            <circle cx="93.0001" cy="93.0001" r="76.9655" fill="currentColor" />
            <g class="avatar-eye">
              <path d="M45.2357 70.2064C45.2357 83.7912 49.4385 91.2266 54.6704 95.3221C59.9726 99.4726 66.6269 100.431 71.9601 100.431C76.7081 100.431 81.2506 97.2709 84.685 91.642C88.1035 86.0392 90.2667 78.2035 90.2667 69.4689C90.2667 64.9692 90.2656 60.975 89.9627 57.4264C89.66 53.8812 89.0626 50.8855 87.9248 48.376C85.7262 43.527 81.3208 40.0927 71.7127 38.4858C64.5864 37.294 58.0288 40.7349 53.1538 46.8383C48.2745 52.9469 45.2357 61.5673 45.2357 70.2064Z" fill="white" stroke="black" stroke-width="3"/>

            <g class="avatar-eye right">

              <path d="M113.713 74.1064C113.713 77.1687 113.003 79.9247 111.872 81.9033C110.736 83.8915 109.217 85.0327 107.612 85.0327C106.007 85.0327 104.489 83.8915 103.352 81.9033C102.221 79.9247 101.511 77.1687 101.511 74.1064C101.511 71.044 102.221 68.2881 103.352 66.3094C104.489 64.3213 106.007 63.1801 107.612 63.1801C109.217 63.1801 110.736 64.3213 111.872 66.3094C113.003 68.2881 113.713 71.044 113.713 74.1064Z" fill="black" stroke="black" stroke-width="0.672414"/>
              <path d="M110.742 71.1376C110.742 73.7711 109.052 75.7701 107.117 75.7701C105.182 75.7701 103.492 73.7711 103.492 71.1376C103.492 68.504 105.182 66.505 107.117 66.505C109.052 66.505 110.742 68.504 110.742 71.1376Z" fill="white" stroke="white" stroke-width="0.672414"/>
            </g>
          </svg>
          <img id="mouth" src="./mouths/viseme-0.svg" alt="Animated mouth" />
        </div>
      </div>

      <div id="actions" class="actions">
        <button id="play-again" class="primary" type="button">&#9654;&#65038; Play it again</button>
        <button id="record-again" type="button">&#9679; Record another</button>
      </div>

      <div class="readout">
        <span aria-hidden="true" id="mode-label">REVEAL</span>
        <a class="gh" href="https://github.com/webspace-sdk/webspace-lip-syncer" target="_blank" rel="noopener"
          >GITHUB &nearr;</a
        >
        <span aria-hidden="true">VISEME <strong id="viseme">0</strong></span>
      </div>
    </section>

    <audio id="audio" hidden></audio>

    <script type="module" src="./main.js"></script>
  </body>
</html>
